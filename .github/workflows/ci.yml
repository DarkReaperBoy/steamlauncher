name: ci

# Deliberately small — this project fetches every heavy artefact from upstream
# releases (see modules/upstream-binaries.nix), so there is nothing worth
# caching and nothing to compile: a run is an install + an evaluation.
#   check — every push/PR: `nix flake check` + a formatting gate. The full
#           test suite (tests/) joins in on pull requests only, so ordinary
#           pushes stay at about a minute and a half.
#   sync  — daily/manual: newest upstream release binaries + flake.lock,
#           re-verified, opened as a PR.
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # daily, 04:17 UTC — the upstream sync
    - cron: "17 4 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@e50d5f73bfe71c2dd0aa4218de8f4afa59f8f81d # v16

      - name: Evaluate
        run: nix flake check

      - name: Formatting
        run: |
          nix fmt
          git diff --exit-code

      - name: Test suite (eval assertions + config writer)
        if: github.event_name == 'pull_request'
        run: |
          cd tests
          ./test-eval.sh
          ./test-writer.sh

  sync:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@e50d5f73bfe71c2dd0aa4218de8f4afa59f8f81d # v16

      - name: Pick up new upstream release binaries
        # tee outside the worktree: anything the action might otherwise see as a
        # change would end up in the PR diff.
        run: ./ci/update-binaries.sh | tee "$RUNNER_TEMP/update-binaries.log"

      - name: Update flake.lock
        run: nix flake update

      - name: Verify (evaluate everything, fetch + unpack every release binary)
        run: |
          nix flake check
          nix build -L \
            .#sls-steam .#ticket-grabber .#schema-grabber \
            .#millennium .#slsteam-moon .#lumen .#luatools

      - name: Open a PR if anything moved
        id: create-pr
        continue-on-error: true
        uses: peter-evans/create-pull-request@6d6857d36972b65feb161a90e484f2984215f83e # v6.0.5
        with:
          add-paths: |
            upstream.lock.json
            flake.lock
          commit-message: "upstream: daily refresh"
          title: "upstream: daily refresh"
          branch: chore/daily-upstream
          delete-branch: true
          body: |
            Automated daily sync.

            - `upstream.lock.json` — release binaries of SLSsteam, Millennium,
              slsteam-moon, Lumen and LuaTools, each verified against the sha256
              published next to the asset (see `ci/update-binaries.sh`).
            - `flake.lock` — git inputs (`nix flake update`).

            This workflow already ran `nix flake check` and unpacked every
            binary, and the `check` job runs again on this PR.

      # The repo setting "Allow GitHub Actions to create or approve pull requests"
      # may be off; when it is, the branch still gets pushed above, so the sync
      # is never lost — this only turns a red daily run into a clear instruction.
      - name: Explain when the PR could not be opened
        if: steps.create-pr.outcome == 'failure'
        run: |
          echo "::warning::PR not created — the changes are on branch chore/daily-upstream."
          {
            echo "## Changes pushed, PR not opened"
            echo
            echo "GitHub Actions may not create pull requests in this repository."
            echo "Enable **Settings ▸ Actions ▸ General ▸ Allow GitHub Actions to create"
            echo "and approve pull requests** for a fully automatic cycle, or open it now:"
            echo
            echo "https://github.com/${GITHUB_REPOSITORY}/compare/main...chore/daily-upstream"
          } >> "$GITHUB_STEP_SUMMARY"
